<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail zákazky — AutoMek Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #141824;
      --card-elevated: #1a2030;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-strong: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #34d399;
      --danger: #f87171;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Top navbar */
    .top-nav {
      background: rgba(15, 20, 30, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-btn {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.15s;
    }

    .back-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
    }

    .page-container {
      max-width: 960px;
      width: 100%;
      margin: 28px auto;
      padding: 0 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Banner Card */
    .header-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 22px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .order-id-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .order-id-badge {
      font-family: 'Space Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .order-submeta {
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    .status-picker-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-elevated);
      border: 1px solid var(--card-border-strong);
      padding: 8px 14px;
      border-radius: 10px;
    }

    .status-picker-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-picker-select {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .status-picker-select option {
      background: #1a2030;
      color: #fff;
    }

    /* 2-COLUMN GRID */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-2col {
        grid-template-columns: 1fr;
      }
    }

    /* SECTION CARD */
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .card-title-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Key-Value Pair Box */
    .kv-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .kv-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 10px 14px;
      border-radius: 8px;
    }

    .kv-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .kv-val {
      font-size: 0.96rem;
      color: #fff;
      font-weight: 600;
    }

    .kv-val a {
      color: var(--accent);
      text-decoration: none;
    }

    .kv-val a:hover {
      text-decoration: underline;
    }

    /* Severity Pill */
    .urgency-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .urg-crit { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
    .urg-mod { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .urg-min { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }

    /* Symptoms & Description */
    .symptom-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .symptom-tag {
      background: var(--card-elevated);
      border: 1px solid var(--card-border-strong);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .quote-box {
      background: var(--card-elevated);
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 16px 20px;
      font-size: 0.95rem;
      color: #f1f5f9;
      line-height: 1.6;
    }

    /* Audio Player */
    .audio-player-card {
      background: var(--card-elevated);
      border: 1px solid var(--card-border-strong);
      border-radius: 10px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .audio-meta-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sound-bars-anim {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
    }

    .sound-bar-item {
      width: 3px;
      height: 6px;
      background: var(--accent);
      border-radius: 2px;
      transition: height 0.15s;
    }

    .audio-player-card.playing .sound-bar-item:nth-child(1) { animation: barDance 0.5s infinite alternate; }
    .audio-player-card.playing .sound-bar-item:nth-child(2) { animation: barDance 0.7s infinite alternate 0.1s; }
    .audio-player-card.playing .sound-bar-item:nth-child(3) { animation: barDance 0.4s infinite alternate 0.2s; }
    .audio-player-card.playing .sound-bar-item:nth-child(4) { animation: barDance 0.6s infinite alternate 0.15s; }
    .audio-player-card.playing .sound-bar-item:nth-child(5) { animation: barDance 0.8s infinite alternate 0.25s; }

    @keyframes barDance {
      0% { height: 4px; }
      100% { height: 24px; }
    }

    .audio-btn {
      background: #2563eb;
      background-image: linear-gradient(180deg, #38bdf8 0%, #2563eb 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .audio-btn:hover {
      opacity: 0.95;
    }

    /* Photo Gallery */
    .photos-grid-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .photo-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--card-border-strong);
      cursor: pointer;
      transition: all 0.2s;
      background: #0f172a;
    }

    .photo-card:hover {
      border-color: var(--accent);
    }

    .photo-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .photo-card:hover .photo-overlay {
      opacity: 1;
    }

    /* Bottom Actions Bar */
    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
    }

    .btn-delete {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--danger);
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-delete:hover {
      background: rgba(248, 113, 113, 0.1);
      border-color: var(--danger);
    }

    .btn-print {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border-strong);
      color: #fff;
      padding: 9px 22px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .btn-print:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: #fff;
    }

    /* Lightbox Modal */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox-overlay.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    @media print {
      body { background: #fff; color: #000; }
      .top-nav, .footer-actions, .audio-player-card button { display: none; }
      .header-banner, .section-card, .kv-row, .quote-box { border: 1px solid #ccc; background: #fff; color: #000; box-shadow: none; }
      .order-id-badge, .kv-val, .card-title-text { color: #000; }
    }
  </style>
</head>

                  <span class="kv-label">Termín pristavenia vozidla</span>
                  <span class="kv-val" style="display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <input type="date" id="order-date-input" value="${parseBookingToIso(b)}" style="background:#181c27; border:1px solid rgba(255,255,255,0.15); color:#fff; font-family:inherit; font-size:0.85rem; font-weight:600; padding:2px 8px; border-radius:6px; outline:none; cursor:pointer;">
                    <span>o</span>
                    <select id="order-time-select" style="background:#181c27; border:1px solid rgba(255,255,255,0.15); color:#fff; font-family:'Space Mono', monospace; font-size:0.85rem; font-weight:700; padding:2px 8px; border-radius:6px; outline:none; cursor:pointer;">
                      ${['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30'].map(t => `<option value="${t}" ${b.time === t ? 'selected' : ''}>${t}</option>`).join('')}
                    </select>
                  </span>
                </div>
                <div class="kv-row">
                  <span class="kv-label">Pridelený mechanik</span>
                  <span class="kv-val">${escapeHtml(b.mechanic || 'Dispečing servisu')}</span>
                </div>
                <div class="kv-row">
                  <span class="kv-label">Predbežná odhadovaná cena</span>
                  <span class="kv-val" style="color:var(--success); font-size:1.1rem;">${escapeHtml(b.price || '-')}</span>
                </div>
              </div>
            </div>

          </div>

          <!-- KARTA 3: DIAGNOSTIKA & POPIS -->
          <div class="section-card">
            <div class="card-title-row">
              <span class="card-title-text">Diagnostika a hlásené prejavy</span>
            </div>

            <div style="display:flex; flex-direction:column; gap:14px;">
              <div>
                <span class="kv-label" style="display:block; margin-bottom:8px;">Identifikované symptómy závady:</span>
                <div class="symptom-tag-list">${symptomsHtml}</div>
              </div>
              <div>
                <span class="kv-label" style="display:block; margin-bottom:8px;">Slovný popis problému od klienta:</span>
                <div class="quote-box">${escapeHtml(b.problemDesc || 'Zákazník nezadal žiadny dodatočný popis.')}</div>
              </div>
            </div>
          </div>

          <!-- KARTA 4: ZVUKOVÝ ZÁZNAM (AK EXISTUJE) -->
          ${hasAudio ? `
            <div class="section-card">
              <div class="card-title-row">
                <span class="card-title-text">Zvukový záznam závady z mikrofónu</span>
              </div>
              <div class="audio-player-card" id="audio-player-card">
                <div class="audio-meta-left">
                  <div class="sound-bars-anim">
                    <div class="sound-bar-item"></div>
                    <div class="sound-bar-item"></div>
                    <div class="sound-bar-item"></div>
                    <div class="sound-bar-item"></div>
                    <div class="sound-bar-item"></div>
                  </div>
                  <div>
                    <span style="font-weight:700; color:#fff; display:block; font-size:0.95rem;">Hluk motora / klepanie závady</span>
                    <span style="font-size:0.8rem; color:var(--text-secondary);" id="audio-time-label">0:00 / 0:03.5 &bull; Záznam klienta pri diagnostike</span>
                  </div>
                </div>
                <button type="button" class="audio-btn" id="audio-play-btn">
                  <span>Prehrať zvuk</span>
                </button>
              </div>
            </div>
          ` : ''}

          <!-- KARTA 5: FOTOGRAFIE (AK EXISTUJÚ) -->
          ${hasPhotos ? `
            <div class="section-card">
              <div class="card-title-row">
                <span class="card-title-text">Priložené fotografie závady (${b.photos.length})</span>
              </div>
              <div class="photos-grid-list">
                ${b.photos.map((p, idx) => `
                  <div class="photo-card" data-src="${p}">
                    <img src="${p}" class="photo-img" alt="Foto závady #${idx+1}">
                    <div class="photo-overlay">Zväčšiť fotografiu</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- FOOTER ACTIONS -->
          <div class="footer-actions">
            <button type="button" class="btn-delete" id="delete-order-btn">Zmazať túto zákazku</button>
            <button type="button" class="btn-print" onclick="window.print()">Vytlačiť zákazkový list</button>
          </div>
        `;

        // Zmena stavu
        const statusSelect = document.getElementById('order-status-select');
        statusSelect.addEventListener('change', (e) => {
          b.status = e.target.value;
          saveAllBookings(bookings);
        });

        // Audio
        if (hasAudio) {
          const playBtn = document.getElementById('audio-play-btn');
          const audioCard = document.getElementById('audio-player-card');
          const timeLabel = document.getElementById('audio-time-label');

          let audio = new Audio(b.audioData);

          audio.ontimeupdate = () => {
            if (audio.duration) {
              const cur = audio.currentTime.toFixed(1);
              const dur = audio.duration.toFixed(1);
              timeLabel.textContent = `0:0${cur} / 0:0${dur} • Záznam klienta pri diagnostike`;
            }
          };

          playBtn.addEventListener('click', () => {
            if (audio.paused) {
              audio.play().then(() => {
                playBtn.textContent = 'Pozastaviť';
                audioCard.classList.add('playing');
              }).catch(err => {
                console.warn('Audio play fallback:', err);
              });
            } else {
              audio.pause();
              playBtn.textContent = 'Prehrať zvuk';
              audioCard.classList.remove('playing');
            }
          });

          audio.onended = () => {
            playBtn.textContent = 'Prehrať zvuk';
            audioCard.classList.remove('playing');
            audio.currentTime = 0;
          };
        }

        // Lightbox
        document.querySelectorAll('.photo-card').forEach(card => {
          card.addEventListener('click', () => {
            const src = card.getAttribute('data-src');
            lightboxImg.src = src;
            lightboxOverlay.classList.add('open');
          });
        });

        // Zmena času
        const timeSelect = document.getElementById('order-time-select');
        if (timeSelect) {
          timeSelect.addEventListener('change', (e) => {
            b.time = e.target.value;
            saveAllBookings(bookings);
          });
        }

        // Zmazanie
        document.getElementById('delete-order-btn').addEventListener('click', () => {
          if (confirm('Naozaj chcete zmazať zákazku #' + b.id + '?')) {
            bookings = bookings.filter(item => item.id !== b.id);
            saveAllBookings(bookings);
            alert('Zákazka bola vymazaná.');
            window.location.href = 'admin.html';
          }
        });
      }

      lightboxClose.addEventListener('click', () => {
        lightboxOverlay.classList.remove('open');
      });
      lightboxOverlay.addEventListener('click', (e) => {
        if (e.target === lightboxOverlay) lightboxOverlay.classList.remove('open');
      });

      function saveAllBookings(data) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
      }

      
      function formatPlate(plate) {
        if (!plate || plate === 'Nezadané' || plate === '-') return '-';
        let clean = String(plate).replace(/-/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
        const noSpace = clean.replace(/\s/g, '');
        if (/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(noSpace)) {
          return noSpace.slice(0, 2) + ' ' + noSpace.slice(2, 5) + ' ' + noSpace.slice(5);
        }
        return clean;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      }
    })();
  </script>
</body>
</html>
