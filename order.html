<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail zákazky — JK Garáž</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #141824;
      --card-elevated: #1a2030;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-strong: rgba(255, 255, 255, 0.15);
      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #34d399;
      --danger: #f87171;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Top navbar */
    .top-nav {
      background: rgba(15, 20, 30, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-btn {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.15s;
    }

    .back-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
    }

    .page-container {
      max-width: 960px;
      width: 100%;
      margin: 28px auto;
      padding: 0 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Banner Card */
    .header-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 22px 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .order-id-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .order-id-badge {
      font-family: 'Space Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .order-submeta {
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    .status-picker-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-elevated);
      border: 1px solid var(--card-border-strong);
      padding: 8px 14px;
      border-radius: 10px;
    }

    .status-picker-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-picker-select {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .status-picker-select option {
      background: #1a2030;
      color: #fff;
    }

    /* 2-COLUMN GRID */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-2col {
        grid-template-columns: 1fr;
      }
    }

    /* SECTION CARD */
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .card-title-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Key-Value Pair Box */
    .kv-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .kv-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 10px 14px;
      border-radius: 8px;
    }

    .kv-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .kv-val {
      font-size: 0.96rem;
      color: #fff;
      font-weight: 600;
    }

    .kv-val a {
      color: var(--accent);
      text-decoration: none;
    }

    .kv-val a:hover {
      text-decoration: underline;
    }

    /* Symptoms & Description */
    .symptom-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .symptom-tag {
      background: var(--card-elevated);
      border: 1px solid var(--card-border-strong);
      color: #fff;
      font-size: 0.84rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
    }

    .quote-box {
      background: var(--card-elevated);
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 16px 20px;
      font-size: 0.95rem;
      color: #f1f5f9;
      line-height: 1.6;
    }

    /* Audio Player */
    .audio-player-card {
      background: var(--card-elevated);
      border: 1px solid var(--card-border-strong);
      border-radius: 10px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .audio-meta-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .sound-bars-anim {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
    }

    .sound-bar-item {
      width: 3px;
      height: 6px;
      background: var(--accent);
      border-radius: 2px;
      transition: height 0.15s;
    }

    .audio-player-card.playing .sound-bar-item:nth-child(1) { animation: barDance 0.5s infinite alternate; }
    .audio-player-card.playing .sound-bar-item:nth-child(2) { animation: barDance 0.7s infinite alternate 0.1s; }
    .audio-player-card.playing .sound-bar-item:nth-child(3) { animation: barDance 0.4s infinite alternate 0.2s; }
    .audio-player-card.playing .sound-bar-item:nth-child(4) { animation: barDance 0.6s infinite alternate 0.15s; }
    .audio-player-card.playing .sound-bar-item:nth-child(5) { animation: barDance 0.8s infinite alternate 0.25s; }

    @keyframes barDance {
      0% { height: 4px; }
      100% { height: 24px; }
    }

    .audio-btn {
      background: #2563eb;
      background-image: linear-gradient(180deg, #38bdf8 0%, #2563eb 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .audio-btn:hover {
      opacity: 0.95;
    }

    /* Photo Gallery */
    .photos-grid-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .photo-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--card-border-strong);
      cursor: pointer;
      transition: all 0.2s;
      background: #0f172a;
    }

    .photo-card:hover {
      border-color: var(--accent);
    }

    .photo-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .photo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .photo-card:hover .photo-overlay {
      opacity: 1;
    }

    /* Bottom Actions Bar */
    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-delete {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--danger);
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-delete:hover {
      background: rgba(248, 113, 113, 0.1);
      border-color: var(--danger);
    }

    .btn-print {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border-strong);
      color: #fff;
      padding: 9px 22px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }

    .btn-print:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: #fff;
    }

    /* Lightbox Modal */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox-overlay.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* HIDDEN IN WEB VIEW, USED ONLY FOR PROFESSIONAL PRINT */
    .print-only-container {
      display: none;
    }

    /* ========================================================================== */
    /* PROFESIONÁLNY TLAČOVÝ ZÁKAZKOVÝ LIST PRE TLAČIAREŇ (A4 ČIERNOBIELY DOKUMENT) */
    /* ========================================================================== */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm 15mm;
      }

      body {
        background: #ffffff !important;
        color: #111827 !important;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif !important;
        font-size: 11pt !important;
        line-height: 1.4 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Skryť kompletný webový UI layout */
      .top-nav,
      .page-container,
      .lightbox-overlay {
        display: none !important;
      }

      /* Zobraziť štruktúrovaný čistý zákazkový list */
      .print-only-container {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 0 !important;
      }

      .p-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #1e293b;
        padding-bottom: 12px;
        margin-bottom: 16px;
      }

      .p-logo-title {
        font-size: 18pt;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #0f172a;
        margin-bottom: 2px;
      }

      .p-subbrand {
        font-size: 9pt;
        color: #475569;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .p-doc-box {
        text-align: right;
      }

      .p-doc-title {
        font-size: 14pt;
        font-weight: 800;
        color: #0f172a;
        text-transform: uppercase;
      }

      .p-doc-num {
        font-family: 'Space Mono', monospace;
        font-size: 13pt;
        font-weight: 700;
        color: #0369a1;
      }

      .p-meta-date {
        font-size: 8.5pt;
        color: #64748b;
        margin-top: 2px;
      }

      .p-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }

      .p-box {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 10px 14px;
        background: #f8fafc;
      }

      .p-box-title {
        font-size: 8.5pt;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #475569;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 4px;
        margin-bottom: 8px;
      }

      .p-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
        font-size: 9.5pt;
      }

      .p-row:last-child {
        margin-bottom: 0;
      }

      .p-lbl {
        color: #64748b;
        font-weight: 500;
      }

      .p-val {
        font-weight: 700;
        color: #0f172a;
      }

      .p-plate-val {
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 10.5pt;
        background: #ffffff;
        border: 1px solid #94a3b8;
        padding: 1px 6px;
        border-radius: 4px;
      }

      .p-section {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        margin-bottom: 14px;
        overflow: hidden;
      }

      .p-sec-head {
        background: #f1f5f9;
        font-size: 8.5pt;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #334155;
        padding: 6px 12px;
        border-bottom: 1px solid #cbd5e1;
      }

      .p-sec-body {
        padding: 10px 12px;
        font-size: 9.5pt;
      }

      .p-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 4px;
      }

      .p-table th {
        background: #f8fafc;
        font-size: 8pt;
        font-weight: 700;
        text-transform: uppercase;
        color: #475569;
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #cbd5e1;
      }

      .p-table td {
        padding: 8px;
        border-bottom: 1px solid #e2e8f0;
        font-size: 9.5pt;
      }

      .p-table tr:last-child td {
        border-bottom: none;
      }

      .p-desc-text {
        font-style: italic;
        color: #334155;
        background: #f8fafc;
        padding: 8px 12px;
        border-left: 3px solid #64748b;
        margin-top: 4px;
        border-radius: 0 4px 4px 0;
      }

      .p-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 6px;
      }

      .p-tag {
        border: 1px solid #94a3b8;
        background: #ffffff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 8.5pt;
        font-weight: 600;
      }

      .p-work-lines {
        height: 65px;
        border: 1px dashed #cbd5e1;
        border-radius: 4px;
        margin-top: 6px;
        padding: 6px;
        color: #94a3b8;
        font-size: 8.5pt;
      }

      .p-price-total-box {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: #f8fafc;
        border-top: 1px solid #cbd5e1;
        font-size: 10.5pt;
        font-weight: 700;
      }

      .p-signatures {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        margin-top: 28px;
        padding-top: 10px;
      }

      .p-sign-col {
        text-align: center;
      }

      .p-sign-line {
        border-top: 1px solid #334155;
        margin-top: 40px;
        padding-top: 4px;
        font-size: 8.5pt;
        font-weight: 600;
        color: #334155;
      }

      .p-footer-legal {
        margin-top: 20px;
        font-size: 7.5pt;
        color: #94a3b8;
        text-align: center;
        border-top: 1px solid #e2e8f0;
        padding-top: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="top-nav">
    <a href="admin.html" class="back-btn" aria-label="Návrat späť do zoznamu zákaziek">
      <span>Späť do zoznamu zákaziek</span>
    </a>
    <span style="font-weight: 700; font-size: 0.92rem; color: #fff;">JK Garáž Servisný list</span>
  </header>

  <main class="page-container" id="main-content">
    <!-- Rendered dynamically for web screen -->
  </main>

  <!-- DEDICATED CLEAN PRINT SHEET (Rendered dynamically, visible only when printing) -->
  <div class="print-only-container" id="print-sheet-content">
    <!-- Rendered dynamically for printer -->
  </div>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Náhľad fotografie">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Zatvoriť zväčšenú fotografiu">&times;</button>
    <img src="" class="lightbox-img" id="lightbox-img" alt="Zväčšená fotografia">
  </div>

  <script>
    (function() {
      const STORAGE_KEY = 'automek_bookings';

      const mainContent = document.getElementById('main-content');
      const printSheetContent = document.getElementById('print-sheet-content');
      const lightboxOverlay = document.getElementById('lightbox-overlay');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxClose = document.getElementById('lightbox-close');

      const urlParams = new URLSearchParams(window.location.search);
      let targetId = urlParams.get('id') || '';
      targetId = targetId.trim().replace(/^#/, '');

      // This page opens in a new tab from admin.html, so it has no sessionStorage of
      // its own — pick up the admin token handed off via localStorage (shared across
      // tabs) and consume it immediately so it doesn't linger.
      try {
        const handoff = localStorage.getItem('jk_admin_jwt_handoff');
        if (handoff) {
          sessionStorage.setItem('jk_admin_jwt', handoff);
          localStorage.removeItem('jk_admin_jwt_handoff');
        }
      } catch (e) {}

      let bookings = [];

      const MONTH_NAMES_SK = [
        'Január', 'Február', 'Marec', 'Apríl', 'Máj', 'Jún',
        'Júl', 'August', 'September', 'Október', 'November', 'December'
      ];
      const WEEKDAYS_FULL_SK = ['Nedeľa', 'Pondelok', 'Utorok', 'Streda', 'Štvrtok', 'Piatok', 'Sobota'];

      function formatDateForBooking(dateObj) {
        const weekdayFullName = WEEKDAYS_FULL_SK[dateObj.getDay()];
        const day = dateObj.getDate();
        const monthName = MONTH_NAMES_SK[dateObj.getMonth()];
        const year = dateObj.getFullYear();
        return `${weekdayFullName}, ${day}. ${monthName} ${year}`;
      }

      function parseBookingToDateObj(b) {
        if (!b || !b.date) return new Date();
        const s = String(b.date).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
          const [y, m, d] = s.split('-').map(Number);
          return new Date(y, m - 1, d);
        }
        const dmyMatch = s.match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
        if (dmyMatch) {
          return new Date(parseInt(dmyMatch[3], 10), parseInt(dmyMatch[2], 10) - 1, parseInt(dmyMatch[1], 10));
        }
        const dayMatch = s.match(/(\d{1,2})\./);
        const day = dayMatch ? parseInt(dayMatch[1], 10) : 1;
        const yearMatch = s.match(/\b(20\d\d)\b/);
        const year = yearMatch ? parseInt(yearMatch[1], 10) : new Date().getFullYear();
        const monthsSK = ['Jan', 'Feb', 'Mar', 'Apr', 'Máj', 'Jún', 'Júl', 'Aug', 'Sep', 'Okt', 'Nov', 'Dec'];
        let month = new Date().getMonth();
        for (let i = 0; i < 12; i++) {
          if (s.includes(MONTH_NAMES_SK[i]) || s.includes(monthsSK[i])) {
            month = i;
            break;
          }
        }
        return new Date(year, month, day);
      }

      function parseBookingToIso(b) {
        const d = parseBookingToDateObj(b);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function showNotFound() {
        document.title = 'Zákazka nenájdená — JK Garáž';
        mainContent.innerHTML = `
          <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px; padding:48px 24px; text-align:center; max-width:600px; margin:40px auto;">

            } else {

              audioCard.classList.remove('playing');

                    <td>1.</td>
                    <td><strong>${escapeHtml(b.partName || 'Servisná prehliadka a oprava')}</strong> — diagnostika a základný úkon</td>
                    <td style="text-align:center;">1 ks</td>
                    <td style="text-align:right; font-weight:700;">${escapeHtml(b.price || '-')}</td>
                  </tr>
                  <tr>
                    <td>2.</td>
                    <td style="color:#94a3b8; font-style:italic;">Doplnkový materiál / drobný servisný materiál</td>
                    <td style="text-align:center; color:#94a3b8;">—</td>
                    <td style="text-align:right; color:#94a3b8;">—</td>
                  </tr>
                  <tr>
                    <td>3.</td>
                    <td style="color:#94a3b8; font-style:italic;">Ekologická likvidácia a réžia</td>
                    <td style="text-align:center; color:#94a3b8;">—</td>
                    <td style="text-align:right; color:#94a3b8;">—</td>
                  </tr>
                </tbody>
              </table>

              <div class="p-price-total-box">
                <span style="color:#475569; font-weight:600;">Predbežná dohodnutá suma:</span>
                <span style="font-size:12pt; color:#0f172a;">${escapeHtml(b.price || '0 €')}</span>
              </div>
            </div>
          </div>

          <!-- POZNÁMKY PRI PREBERANÍ -->
          <div style="margin-bottom: 12px;">
            <span style="font-size:8pt; font-weight:700; text-transform:uppercase; color:#64748b;">Záznam technika o stave vozidla pri prevzatí:</span>
            <div class="p-work-lines">
              Stav km: ..................... / Stav paliva: ..................... / Viditeľné poškodenia karosérie: ..............................................................
            </div>
          </div>

          <!-- PODPISY -->
          <div class="p-signatures">
            <div class="p-sign-col">
              <div class="p-sign-line">Podpis prijímacieho technika (JK Garáž)</div>
            </div>
            <div class="p-sign-col">
              <div class="p-sign-line">Podpis zákazníka / Preberajúcej osoby</div>
            </div>
          </div>

          <!-- PRÁVNA PÄTIČKA -->
          <div class="p-footer-legal">
            Zákazník svojím podpisom potvrdzuje správnosť uvedených údajov, súhlas s vykonaním servisných prác a oboznámenie sa so všeobecnými obchodnými podmienkami JK Garáž.
          </div>
        `;
      }

      lightboxClose.addEventListener('click', () => {
        lightboxOverlay.classList.remove('open');
      });
      lightboxOverlay.addEventListener('click', (e) => {
        if (e.target === lightboxOverlay) lightboxOverlay.classList.remove('open');
      });

      function saveAllBookings(data) {
        try {
          if (data && data.length > 300) {
            data.length = 300;
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (err) {
          console.warn('LocalStorage save failed in order.html:', err);
        }
      }

      function formatPlate(plate) {
        if (!plate || plate === 'Nezadané' || plate === '-') return '-';
        let clean = String(plate).replace(/-/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
        const noSpace = clean.replace(/\s/g, '');
        if (/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(noSpace)) {
          return noSpace.slice(0, 2) + ' ' + noSpace.slice(2, 5) + ' ' + noSpace.slice(5);
        }
        return clean;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      }
    })();
  </script>
