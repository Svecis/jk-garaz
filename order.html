<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zákazkový list — JK Garáž</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: #0f131c;
      --card-elevated: #151a27;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-strong: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-glow: rgba(56, 189, 248, 0.2);
      
      --pending: #f59e0b;
      --pending-glow: rgba(245, 158, 11, 0.18);
      --confirmed: #38bdf8;
      --confirmed-glow: rgba(56, 189, 248, 0.18);
      --in-progress: #818cf8;
      --in-progress-glow: rgba(129, 140, 248, 0.18);
      --completed: #10b981;
      --completed-glow: rgba(16, 185, 129, 0.18);
      --cancelled: #f43f5e;
      --cancelled-glow: rgba(244, 63, 94, 0.18);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(129, 140, 248, 0.04) 0%, transparent 40%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* TOP NAVIGATION BAR */
    .top-nav {
      background: rgba(11, 14, 22, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 16px;
    }

    .top-nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .back-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(-2px);
    }

    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.01em;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .top-nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .btn-action-primary {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #fff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .btn-action-primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
      color: #fff;
    }

    /* MAIN CONTAINER */
    .page-container {
      max-width: 1080px;
      width: 100%;
      margin: 28px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* HEADER WORK ORDER BANNER */
    .order-hero-banner {
      background: linear-gradient(145deg, #111624 0%, #0c101a 100%);
      border: 1px solid var(--card-border-strong);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .order-hero-banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8 0%, #818cf8 50%, #34d399 100%);
    }

    .hero-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .hero-title-group {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }

    .order-id-code {
      font-family: 'Space Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .order-type-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* DYNAMIC STATUS BADGE SELECTOR */
    .status-select-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #181f30;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .status-select-wrap:hover {
      border-color: rgba(255, 255, 255, 0.25);
      background: #1c2438;
    }

    .status-indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-select-wrap.status-pending .status-indicator-dot { background: var(--pending); box-shadow: 0 0 10px var(--pending); }
    .status-select-wrap.status-confirmed .status-indicator-dot { background: var(--confirmed); box-shadow: 0 0 10px var(--confirmed); }
    .status-select-wrap.status-in_progress .status-indicator-dot { background: var(--in-progress); box-shadow: 0 0 10px var(--in-progress); }
    .status-select-wrap.status-completed .status-indicator-dot { background: var(--completed); box-shadow: 0 0 10px var(--completed); }
    .status-select-wrap.status-cancelled .status-indicator-dot { background: var(--cancelled); box-shadow: 0 0 10px var(--cancelled); }

    .status-dropdown {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .status-dropdown option {
      background: #141824;
      color: #fff;
      padding: 8px;
    }

    /* 4-KPI QUICK HIGHLIGHT TILES */
    .kpi-strip-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    @media (max-width: 900px) {
      .kpi-strip-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .kpi-strip-grid {
        grid-template-columns: 1fr;
      }
    }

    .kpi-tile {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .kpi-tile:hover {
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }

    .kpi-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kpi-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      word-break: break-word;
    }

    /* SLOVAK LICENCE PLATE BADGE */
    .sk-plate-badge {
      display: inline-flex;
      align-items: center;
      background: #fff;
      color: #0b0e14;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1.5px solid #cbd5e1;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      width: fit-content;
    }

    .sk-plate-flag {
      background: #003399;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .sk-plate-text {
      padding: 3px 8px;
      letter-spacing: 0.08em;
    }

    /* 2-COLUMN SECTION GRID */
    .sections-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 820px) {
      .sections-grid {
        grid-template-columns: 1fr;
      }
    }

    /* SECTION CARD */
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      padding-bottom: 14px;
    }

    .card-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .card-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
    }

    /* KEY VALUE ROWS */
    .field-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      transition: background 0.15s;
    }

    .field-row:hover {
      background: rgba(255, 255, 255, 0.035);
    }

    .field-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .field-val {
      font-size: 0.96rem;
      color: #fff;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field-val a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s;
    }

    .field-val a:hover {
      text-decoration: underline;
      color: #7dd3fc;
    }

    /* DATE & TIME INLINE PICKER */
    .datetime-inline-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #161c2b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 4px 10px;
    }

    .inline-date-input, .inline-time-select {
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .inline-time-select {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      color: var(--accent);
    }

    .inline-time-select option {
      background: #141824;
      color: #fff;
    }

    /* SYMPTOM PILLS */
    .symptom-tags-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .symptom-pill {
      background: #1a2233;
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #e2e8f0;
      font-size: 0.86rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 100px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .symptom-pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* QUOTE DESCRIPTION BOX */
    .client-quote-box {
      background: #131826;
      border-left: 4px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 16px 20px;
      font-size: 0.94rem;
      color: #f1f5f9;
      line-height: 1.6;
      font-style: italic;
    }

    /* TECHNICIAN NOTES / PROTOCOL TEXTAREA */
    .tech-notes-area {
      width: 100%;
      min-height: 100px;
      background: #131826;
      border: 1px solid var(--card-border-strong);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      transition: all 0.2s;
    }

    .tech-notes-area:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .tech-notes-area::placeholder {
      color: var(--text-muted);
    }

    /* AUDIO PLAYER COMPONENT */
    .audio-player-card {
      background: #141a29;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: var(--radius-sm);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .sound-bars-anim {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 26px;
    }

    .sound-bar-item {
      width: 4px;
      height: 6px;
      background: var(--accent);
      border-radius: 2px;
      transition: height 0.15s;
    }

    .audio-player-card.playing .sound-bar-item:nth-child(1) { animation: barDance 0.5s infinite alternate; }
    .audio-player-card.playing .sound-bar-item:nth-child(2) { animation: barDance 0.7s infinite alternate 0.1s; }
    .audio-player-card.playing .sound-bar-item:nth-child(3) { animation: barDance 0.4s infinite alternate 0.2s; }
    .audio-player-card.playing .sound-bar-item:nth-child(4) { animation: barDance 0.6s infinite alternate 0.15s; }
    .audio-player-card.playing .sound-bar-item:nth-child(5) { animation: barDance 0.8s infinite alternate 0.25s; }

    @keyframes barDance {
      0% { height: 4px; }
      100% { height: 26px; }
    }

    .audio-play-btn {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 10px 22px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .audio-play-btn:hover {
      box-shadow: 0 0 16px var(--accent-glow);
      transform: translateY(-1px);
    }

    /* PHOTOS GRID */
    .photos-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .photo-thumbnail-card {
      position: relative;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1.5px solid var(--card-border-strong);
      cursor: pointer;
      background: #090c14;
      aspect-ratio: 16 / 10;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .photo-thumbnail-card:hover {
      border-color: var(--accent);
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .photo-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-hover-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s;
      gap: 6px;
    }

    .photo-thumbnail-card:hover .photo-hover-overlay {
      opacity: 1;
    }

    /* FOOTER BAR */
    .order-footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding-top: 10px;
    }

    .btn-danger-outline {
      background: transparent;
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: var(--cancelled);
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-danger-outline:hover {
      background: rgba(244, 63, 94, 0.12);
      border-color: var(--cancelled);
      color: #fff;
    }

    /* LIGHTBOX MODAL */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox-overlay.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.4rem;
      transition: all 0.2s;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* TOAST NOTIFICATION */
    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111827;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast-popup.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ========================================================= */
    /* PRINT OPTIMIZATION — OFFICIAL WORK ORDER DOCUMENT (A4)   */
    /* ========================================================= */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
        font-size: 12px !important;
        padding-bottom: 0 !important;
      }

      .top-nav,
      .top-nav-actions,
      .order-footer-bar,
      .audio-player-card button,
      .lightbox-overlay {
        display: none !important;
      }

      .page-container {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        gap: 14px !important;
      }

      .order-hero-banner {
        background: #fff !important;
        border: 2px solid #000 !important;
        box-shadow: none !important;
        padding: 16px 20px !important;
        color: #000 !important;
      }

      .order-hero-banner::before {
        display: none !important;
      }

      .order-id-code, .brand-title, .kpi-val, .field-val, .card-title {
        color: #000 !important;
      }

      .kpi-tile, .section-card, .field-row {
        background: #fff !important;
        border: 1px solid #94a3b8 !important;
        box-shadow: none !important;
        color: #000 !important;
      }

      .sk-plate-badge {
        border: 2px solid #000 !important;
      }

  <script>
    (function() {
      const STORAGE_KEY = 'automek_bookings';

      const mainContent = document.getElementById('main-content');
      const topNavActions = document.getElementById('top-nav-actions');
      const lightboxOverlay = document.getElementById('lightbox-overlay');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxClose = document.getElementById('lightbox-close');

      const urlParams = new URLSearchParams(window.location.search);
      let targetId = urlParams.get('id') || '';
      targetId = targetId.trim().replace(/^#/, '');

      let bookings = [];
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        bookings = raw ? JSON.parse(raw) : [];
      } catch (e) {
        bookings = [];
      }

      if (!bookings || !Array.isArray(bookings)) {
        bookings = [];
      }

      const MONTH_NAMES_SK = [
        'Január', 'Február', 'Marec', 'Apríl', 'Máj', 'Jún',
        'Júl', 'August', 'September', 'Október', 'November', 'December'
      ];
      const WEEKDAYS_FULL_SK = ['Nedeľa', 'Pondelok', 'Utorok', 'Streda', 'Štvrtok', 'Piatok', 'Sobota'];

      function formatDateForBooking(dateObj) {
        const weekdayFullName = WEEKDAYS_FULL_SK[dateObj.getDay()];
        const day = dateObj.getDate();
        const monthName = MONTH_NAMES_SK[dateObj.getMonth()];
        const year = dateObj.getFullYear();
        return `${weekdayFullName}, ${day}. ${monthName} ${year}`;
      }

      function parseBookingToDateObj(b) {
        if (!b || !b.date) return new Date();
        const s = String(b.date).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
          const [y, m, d] = s.split('-').map(Number);
          return new Date(y, m - 1, d);
        }
        const dmyMatch = s.match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);
        if (dmyMatch) {
          return new Date(parseInt(dmyMatch[3], 10), parseInt(dmyMatch[2], 10) - 1, parseInt(dmyMatch[1], 10));
        }
        const dayMatch = s.match(/(\d{1,2})\./);
        const day = dayMatch ? parseInt(dayMatch[1], 10) : 1;
        const yearMatch = s.match(/\b(20\d\d)\b/);
        const year = yearMatch ? parseInt(yearMatch[1], 10) : new Date().getFullYear();
        const monthsSK = ['Jan', 'Feb', 'Mar', 'Apr', 'Máj', 'Jún', 'Júl', 'Aug', 'Sep', 'Okt', 'Nov', 'Dec'];
        let month = new Date().getMonth();
        for (let i = 0; i < 12; i++) {
          if (s.includes(MONTH_NAMES_SK[i]) || s.includes(monthsSK[i])) {
            month = i;
            break;
          }
        }
        return new Date(year, month, day);
      }

      function parseBookingToIso(b) {
        const d = parseBookingToDateObj(b);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function showToast(msg, icon = '✅') {
        const toast = document.getElementById('toast-popup');
        const toastMsg = document.getElementById('toast-msg');
        const toastIcon = document.getElementById('toast-icon');
        if (!toast) return;
        toastMsg.textContent = msg;
        toastIcon.textContent = icon;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }

      async function syncWithBackend(booking) {
        const token = sessionStorage.getItem('jk_admin_jwt');
        if (token) {
          try {
            await fetch('/api/bookings', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify(booking)
            });
          } catch (e) {
            console.warn('Backend offline sync:', e);
          }
        }
      }

            const tClean = targetId.toUpperCase().replace(/[^A-Z0-9]/g, '');
            return bClean === tClean || bClean.includes(tClean) || tClean.includes(bClean);

          </div>

          <!-- FOOTER ACTIONS -->
          <div class="order-footer-bar">
            <button type="button" class="btn-danger-outline" id="delete-order-btn" aria-label="Zmazať túto zákazku">
              🗑️ Zmazať túto zákazku
            </button>

            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
              <button type="button" class="btn-action" id="bottom-export-ics-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Exportovať do kalendára (.ICS)</span>
              </button>
              <button type="button" class="btn-action btn-action-primary" onclick="window.print()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 6 2 18 2 18 9"></polyline>
                  <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                  <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                <span>Vytlačiť zákazkový list</span>
              </button>
            </div>
          </div>

          <!-- PRINT ONLY SIGNATURE PROTOCOL BLOCK -->
          <div class="print-signatures-row">
            <div class="sign-box">
              Podpis prijímacieho technika (JK Garáž)
            </div>
            <div class="sign-box">
              Podpis zákazníka / splnomocnenej osoby
            </div>
          </div>
        `;

        // STATUS CHANGE HANDLER
        const statusSelect = document.getElementById('order-status-select');
        const statusBadgeWrap = document.getElementById('status-badge-wrap');
        if (statusSelect && statusBadgeWrap) {
          statusSelect.addEventListener('change', (e) => {
            b.status = e.target.value;
            statusBadgeWrap.className = `status-select-wrap status-${b.status}`;
            saveAllBookings(bookings);
            syncWithBackend(b);
            showToast(`Stav zmenený na: ${statusSelect.options[statusSelect.selectedIndex].text}`);
          });
        }

        // DATE & TIME PICKER HANDLERS
        const timeSelect = document.getElementById('order-time-select');
        if (timeSelect) {
          timeSelect.addEventListener('change', (e) => {
            b.time = e.target.value;
            saveAllBookings(bookings);
            syncWithBackend(b);
            showToast(`Čas zmenený na ${b.time}`);
          });
        }

        const dateInput = document.getElementById('order-date-input');
        if (dateInput) {
          dateInput.addEventListener('change', (e) => {
            if (!e.target.value) return;
            const [y, m, d] = e.target.value.split('-').map(Number);
            const newDateObj = new Date(y, m - 1, d);
            b.date = formatDateForBooking(newDateObj);
            saveAllBookings(bookings);
            syncWithBackend(b);
            showToast(`Termín zmenený na ${b.date}`);
          });
        }

        // TECHNICIAN NOTES AUTO-SAVE
        const techNotesInput = document.getElementById('tech-notes-input');
        if (techNotesInput) {
          let notesTimer = null;
          techNotesInput.addEventListener('input', (e) => {
            b.techNotes = e.target.value;
            clearTimeout(notesTimer);
            notesTimer = setTimeout(() => {
              saveAllBookings(bookings);
              syncWithBackend(b);
              showToast('Poznámky uložené');
            }, 600);
          });
        }

        // AUDIO PLAYER LOGIC
        if (hasAudio) {
          const playBtn = document.getElementById('audio-play-btn');
          const audioCard = document.getElementById('audio-player-card');
          const timeLabel = document.getElementById('audio-time-label');

          let audio = new Audio(b.audioData);

          audio.ontimeupdate = () => {
            if (audio.duration) {
              const cur = audio.currentTime.toFixed(1);
              const dur = audio.duration.toFixed(1);
              timeLabel.textContent = `0:0${cur} / 0:0${dur} • Záznam klienta pri diagnostike`;
            }
          };

          playBtn.addEventListener('click', () => {
            if (audio.paused) {
              audio.play().then(() => {
                playBtn.innerHTML = `
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                  </svg>
                  <span>Pozastaviť</span>
                `;
                audioCard.classList.add('playing');
              }).catch(err => {
                console.warn('Audio play fallback:', err);
              });
            } else {
              audio.pause();
              playBtn.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span>Prehrať zvuk</span>
              `;
              audioCard.classList.remove('playing');
            }
          });

          audio.onended = () => {
            playBtn.innerHTML = `
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>Prehrať zvuk</span>
            `;
            audioCard.classList.remove('playing');
            audio.currentTime = 0;
          };
        }

        // LIGHTBOX PHOTO HANDLERS
        document.querySelectorAll('.photo-thumbnail-card').forEach(card => {
          const openPhoto = () => {
            const src = card.getAttribute('data-src');
            lightboxImg.src = src;
            lightboxOverlay.classList.add('open');
          };
          card.addEventListener('click', openPhoto);
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openPhoto();
            }
          });
        });

        // ICS EXPORT LOGIC
        const triggerIcsExport = () => {
          const dateObj = parseBookingToDateObj(b);
          const y = dateObj.getFullYear();
          const m = String(dateObj.getMonth() + 1).padStart(2, '0');
          const d = String(dateObj.getDate()).padStart(2, '0');
          let hh = '10', mm = '00';
          if (b.time && b.time.includes(':')) {
            const p = b.time.split(':');
            hh = String(p[0]).padStart(2, '0');
            mm = String(p[1]).padStart(2, '0');
          }
          const startIso = `${y}${m}${d}T${hh}${mm}00`;
          const endD = new Date(y, dateObj.getMonth(), parseInt(d, 10), parseInt(hh, 10) + 1, parseInt(mm, 10));
          const endIso = `${endD.getFullYear()}${String(endD.getMonth()+1).padStart(2,'0')}${String(endD.getDate()).padStart(2,'0')}T${String(endD.getHours()).padStart(2,'0')}${String(endD.getMinutes()).padStart(2,'0')}00`;

          const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
          const plateClean = formatPlate(b.plate);
          const summary = `Servis JK Garáž: ${b.customer || 'Zákazník'} (${plateClean})`;
          const desc = `Zákazka: #${b.id}\nZákazník: ${b.customer || '-'}\nTelefón: ${b.phone || '-'}\nEČV: ${plateClean}\nDiel: ${b.partName || '-'}\nCena: ${b.price || '-'}\nPopis: ${b.problemDesc || '-'}`;

          const icsText = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'PRODID:-//JK Garaz//Servisny List//SK',
            'CALSCALE:GREGORIAN',
            'METHOD:PUBLISH',
            'BEGIN:VEVENT',
            `UID:${b.id}@jk-garaz.sk`,
            `DTSTAMP:${stamp}`,
            `DTSTART:${startIso}`,
            `DTEND:${endIso}`,
            `SUMMARY:${summary.replace(/,/g, '\\,')}`,
            `DESCRIPTION:${desc.replace(/\n/g, '\\n').replace(/,/g, '\\,')}`,
            'LOCATION:JK Garáž Servis',
            'STATUS:CONFIRMED',
            'END:VEVENT',
            'END:VCALENDAR'
          ].join('\r\n');

          const blob = new Blob([icsText], { type: 'text/calendar;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.setAttribute('download', `servis_${b.id}_${(b.customer || 'zakazka').replace(/\s+/g, '_')}.ics`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
          showToast('Kalendár (.ICS) stiahnutý');
        };

        const topIcsBtn = document.getElementById('top-export-ics-btn');
        if (topIcsBtn) topIcsBtn.addEventListener('click', triggerIcsExport);

        const bottomIcsBtn = document.getElementById('bottom-export-ics-btn');
        if (bottomIcsBtn) bottomIcsBtn.addEventListener('click', triggerIcsExport);

        // DELETE ORDER
        const deleteBtn = document.getElementById('delete-order-btn');
        if (deleteBtn) {
          deleteBtn.addEventListener('click', async () => {
            if (confirm(`Naozaj chcete natrvalo zmazať zákazku #${b.id} (${b.customer || ''})?`)) {
              bookings = bookings.filter(item => item.id !== b.id);
              saveAllBookings(bookings);
              
              const token = sessionStorage.getItem('jk_admin_jwt');
              if (token) {
                try {
                  await fetch(`/api/bookings/${encodeURIComponent(b.id)}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                  });
                } catch (e) {}
              }

              alert('✅ Zákazka bola úspešne vymazaná.');
              window.location.href = 'admin.html';
            }
          });
        }
      }

      lightboxClose.addEventListener('click', () => {
        lightboxOverlay.classList.remove('open');
      });
      lightboxOverlay.addEventListener('click', (e) => {
        if (e.target === lightboxOverlay) lightboxOverlay.classList.remove('open');
      });

      function saveAllBookings(data) {
        try {
          if (data && data.length > 300) {
            data.length = 300;
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (err) {
          console.warn('LocalStorage save failed in order.html:', err);
        }
      }

      function formatPlate(plate) {
        if (!plate || plate === 'Nezadané' || plate === '-') return '-';
        let clean = String(plate).replace(/-/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
        const noSpace = clean.replace(/\s/g, '');
        if (/^[A-Z]{2}[0-9]{3}[A-Z]{2}$/.test(noSpace)) {
          return noSpace.slice(0, 2) + ' ' + noSpace.slice(2, 5) + ' ' + noSpace.slice(5);
        }
        return clean;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      }

      init();
    })();
  </script>
</body>
</html>
